name: Exaado Radar
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: trigger radar scan
        run: curl -sS -m 240 "https://exaado-radar.vercel.app/api/run?k=exaado-run-7f3k2mq9" || echo "scan attempt finished"
